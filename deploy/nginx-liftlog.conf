map $uri $liftlog_dev_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.liftlog.cc app.liftlog.cc liftlog.cc www.liftlog.cc;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.liftlog.cc;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/dev.liftlog.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.liftlog.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/liftlog/nonprod/current;
    index index.html;

    add_header Cache-Control $liftlog_dev_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The development mobile preview embeds this same-origin app.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.liftlog.cc liftlog.cc www.liftlog.cc;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/liftlog.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liftlog.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/liftlog/maintenance/current;

    add_header Cache-Control "no-store, max-age=0" always;
    add_header Retry-After "3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    error_page 503 =503 /__liftlog_maintenance;

    location = /__liftlog_maintenance {
        internal;
        alias /srv/liftlog/maintenance/current/index.html;
        default_type text/html;
    }

    location / {
        return 503;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

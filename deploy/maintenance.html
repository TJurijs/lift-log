<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0f12" />
    <title>Lift Log — preparing launch</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #0a0f12; color: #f3f6ee; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 520px); padding: 40px; border: 1px solid #28332c; border-radius: 24px; background: #111814; }
      p:first-child { color: #b7ee62; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: clamp(32px, 8vw, 52px); line-height: 1; }
      p:last-child { color: #a9b2ab; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <p>Lift Log</p>
      <h1>Preparing launch.</h1>
      <p>The production app is being set up. The private pilot will open here shortly.</p>
    </main>
  </body>
</html>
